server.port=8082
spring.application.name=learning-service

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:learningservicedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Producer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ── JWT Configuration ─────────────────────────────────────────────────────────
# Must match the secret used by the auth service (main backend) to sign tokens.
# The JwtAuthFilter reads the "role" claim embedded at login to reconstruct
# Spring Security authorities without a local user-store lookup.
skillsphere.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
skillsphere.app.jwtExpirationMs=86400000