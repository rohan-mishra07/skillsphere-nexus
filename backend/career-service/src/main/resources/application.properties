spring.application.name=career-service
server.port=8080

# Database Configuration (H2 In-Memory for easy standalone execution or Postgres fallback)
spring.datasource.url=jdbc:h2:mem:careerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=career-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ── JWT Configuration ─────────────────────────────────────────────────────────
# Must match the secret used by the auth service (main backend) to sign tokens.
# The JwtAuthFilter reads the "role" claim embedded at login to reconstruct
# Spring Security authorities without a local user-store lookup.
skillsphere.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
skillsphere.app.jwtExpirationMs=86400000

