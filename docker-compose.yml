version: '3.8'

services:
  # 1. Keycloak Service
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8080:8080"
    networks:
      - skillsphere-net
    restart: unless-stopped

  # 2. Backend Service (user-service)
  backend:
    build: ./user-service
    container_name: skillsphere-backend
    ports:
      - "8082:8082" # Change to match your Spring Boot port if different
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - keycloak
    networks:
      - skillsphere-net
    restart: unless-stopped

  # 3. Frontend Service
  frontend:
    build: ./frontend
    container_name: skillsphere-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - skillsphere-net
    restart: unless-stopped

networks:
  skillsphere-net:
    driver: bridge